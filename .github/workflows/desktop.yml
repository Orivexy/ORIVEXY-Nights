name: Desktop apps

# Builds ORIVEXY NIGHTS for Windows (.exe), Linux (.AppImage) and macOS (.dmg)
# — Electron + embedded PostgreSQL + schema and base data — and publishes them
# together as one GitHub Release. Pushes to the default branch (and v* tags)
# become the "latest" release, which the download buttons in the README use.
on:
  push:
    branches: [main, claude/charming-lovelace-al31eg]
    tags: ["v*"]
    paths-ignore: [".github/workflows/data-probe.yml"]
  workflow_dispatch:

permissions:
  contents: write

# Every build gets a higher version, so installed apps update themselves to it.
env:
  APP_VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nightly
          POSTGRES_PASSWORD: nightly
          POSTGRES_DB: nightly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nightly" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nightly:nightly@localhost:5432/app_desktop_build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base configuration (migrations + seed, no content)
        run: |
          npx prisma migrate deploy
          ADMIN_EMAIL="" ADMIN_PASSWORD="" npx prisma db seed
          mkdir -p base && npx tsx scripts/export-base-data.mts > base/base-data.sql
      - uses: actions/upload-artifact@v4
        with:
          name: base-data
          path: base/base-data.sql
      # Real clubs (OpenStreetMap) and events (city open data) as of today,
      # bundled so the map is full on first launch. Never blocks a release.
      - name: Initial data snapshot from public sources
        continue-on-error: true
        timeout-minutes: 25
        run: npx tsx --conditions=react-server scripts/record-snapshot.mts snapshot
      # Small image model (CLIP) that detects the parts of each place in its
      # official photos (dance floor, DJ booth, VIP…); shipped as zones.json.
      - uses: actions/cache@v4
        with:
          path: .cache/transformers
          key: zone-model-clip-vit-base-patch32-q8
      - name: Zones of each place (image model)
        continue-on-error: true
        timeout-minutes: 15
        run: test -d snapshot && npx tsx --conditions=react-server scripts/classify-zones.mts snapshot/zones.json
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: snapshot
          if-no-files-found: warn

  windows:
    needs: base-data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NSIS_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: base-data, path: base }
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: snapshot, path: snapshot }
      - name: Version
        run: cd desktop && npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: bash scripts/build-desktop.sh --platform win --base-data base/base-data.sql --snapshot snapshot
      - name: Fix ownership of files written by Docker
        run: sudo chown -R "$(id -u):$(id -g)" dist-desktop desktop
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: |
            dist-desktop/ORIVEXY-NIGHTS-Windows.exe
            dist-desktop/ORIVEXY-NIGHTS-Windows.exe.blockmap
            dist-desktop/latest.yml

  linux:
    needs: base-data
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: base-data, path: base }
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: snapshot, path: snapshot }
      - name: Version
        run: cd desktop && npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: bash scripts/build-desktop.sh --platform linux --base-data base/base-data.sql --snapshot snapshot
      # The packaged app (Electron main process + PostgreSQL + server) must start;
      # a failure blocks the release for every platform.
      - name: Smoke test the packaged app
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          xvfb-run -a dist-desktop/linux-unpacked/orivexy-nights-desktop --no-sandbox > app.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:3000/api/health; then echo " app started"; break; fi
            [ "$i" = 120 ] && { cat app.log; find ~/.config -name "registro.log" -exec tail -50 {} \; ; exit 1; }
            sleep 1
          done
          # With bundled data, the map must show clubs on first launch.
          if [ -d dist-desktop/linux-unpacked/resources/snapshot ]; then
            for i in $(seq 1 90); do
              n=$(curl -s http://localhost:3000/api/map/places | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('places') or []))" 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then echo "map: $n places on first launch"; break; fi
              [ "$i" = 90 ] && { find ~/.config -name "registro.log" -exec tail -50 {} \; ; echo "map empty on first launch"; exit 1; }
              sleep 1
            done
          fi
          # Screenshots show the whole first-launch data: wait for the import to finish.
          for i in $(seq 1 240); do
            find ~/.config -name "registro.log" -exec grep -q "Datos iniciales" {} \; -print | grep -q . && break
            sleep 1
          done
          find ~/.config -name "registro.log" -exec grep -h "Datos iniciales\|Listo en" {} \;
      # Real screenshots of the running app (first launch data, live map) for the README and the release.
      - name: Screenshots
        continue-on-error: true
        run: node scripts/screenshots.mjs http://localhost:3000 dist-desktop/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: |
            dist-desktop/ORIVEXY-NIGHTS-Linux.AppImage
            dist-desktop/latest-linux.yml
            dist-desktop/screenshots/*.png

  mac:
    needs: base-data
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with: { name: base-data, path: base }
      - run: npm ci
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: snapshot, path: snapshot }
      - name: Version
        run: cd desktop && npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - run: bash scripts/build-desktop.sh --platform mac --base-data base/base-data.sql --snapshot snapshot
      - uses: actions/upload-artifact@v4
        with:
          name: app-mac
          path: dist-desktop/ORIVEXY-NIGHTS-Mac.dmg

  # Installs the new .exe on a real Windows machine with the one-line
  # installer (silent, no SmartScreen) and checks the app starts.
  windows-test:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: app-windows, path: dist }
      - name: Install with scripts/install-windows.ps1
        shell: powershell
        env:
          APP_INSTALLER: dist/ORIVEXY-NIGHTS-Windows.exe
          APP_NO_LAUNCH: "1"
        run: |
          $env:APP_INSTALLER = (Resolve-Path $env:APP_INSTALLER).Path
          .\scripts\install-windows.ps1
      - name: The installed app starts
        shell: powershell
        run: |
          $exe = Join-Path $env:ProgramFiles 'ORIVEXY NIGHTS\ORIVEXY NIGHTS.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem $env:ProgramFiles; throw "No instalado en $exe" }
          function Show-Log { Get-ChildItem -Recurse -Filter 'registro.log' $env:APPDATA, $env:ProgramData -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 120 } }
          function Stop-App { Get-Process | Where-Object { $_.Path -like "$env:ProgramFiles\ORIVEXY NIGHTS\*" -or $_.ProcessName -like 'postgres*' } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 3 }
          function Start-AndWait([string]$label, [int]$limit) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            # Own output files: the app must not keep the step's console pipes open.
            Start-Process -FilePath $exe -RedirectStandardOutput "$env:RUNNER_TEMP\app-$label.out" -RedirectStandardError "$env:RUNNER_TEMP\app-$label.err" | Out-Null
            while ($sw.Elapsed.TotalSeconds -lt $limit) {
              try {
                $r = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/api/health' -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) {
                  $home_ = Invoke-WebRequest -Uri 'http://127.0.0.1:3000/' -UseBasicParsing -TimeoutSec 60
                  Write-Host ("{0}: server ready in {1:n1} s, home page {2}" -f $label, $sw.Elapsed.TotalSeconds, $home_.StatusCode)
                  return
                }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            Show-Log; throw "${label} - la app no arranco en ${limit} s"
          }
          Start-AndWait 'first launch' 240
          # With bundled data, the map must show clubs on first launch.
          if (Test-Path "$env:ProgramFiles\ORIVEXY NIGHTS\resources\snapshot") {
            $n = 0
            for ($i = 0; $i -lt 90 -and $n -eq 0; $i++) {
              try { $n = @((Invoke-RestMethod -Uri 'http://127.0.0.1:3000/api/map/places' -TimeoutSec 30).places).Count } catch {}
              if ($n -eq 0) { Start-Sleep -Seconds 1 }
            }
            if ($n -eq 0) { Show-Log; throw "mapa vacio en el primer arranque" }
            Write-Host "map: $n places on first launch"
          }
          Stop-App
          Start-AndWait 'second launch' 60
          Show-Log
          Stop-App

  release:
    needs: [windows, windows-test, linux, mac]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: app-*, path: dist, merge-multiple: true }
      - run: cp scripts/install-windows.ps1 dist/install.ps1
      - name: Version
        id: v
        run: echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-v{0}-{1}', steps.v.outputs.version, github.run_number) }}
          name: "ORIVEXY NIGHTS ${{ steps.v.outputs.version }} (build ${{ github.run_number }})"
          # Builds of the repository's default branch (and v* tags) are the "latest" release.
          prerelease: ${{ github.ref_name != github.event.repository.default_branch && !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/') }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/ORIVEXY-NIGHTS-Windows.exe
            dist/ORIVEXY-NIGHTS-Linux.AppImage
            dist/ORIVEXY-NIGHTS-Mac.dmg
            dist/install.ps1
            dist/screenshots/screenshot-*.png
            dist/latest.yml
            dist/latest-linux.yml
            dist/ORIVEXY-NIGHTS-Windows.exe.blockmap
          body: |
            ## Descargar ORIVEXY NIGHTS

            Elige tu sistema en **Assets** (abajo): **Windows** (`.exe`), **Mac** (`.dmg`) o **Linux** (`.AppImage`). Ábrelo y listo.

            ![ORIVEXY NIGHTS](https://github.com/Orivexy/ORIVEXY-Nights/releases/download/${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-v{0}-{1}', steps.v.outputs.version, github.run_number) }}/screenshot-home.png)
