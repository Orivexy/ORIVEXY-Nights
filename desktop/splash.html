<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ORIVEXY NIGHTS</title>
    <style>
      html, body { margin: 0; height: 100%; background: radial-gradient(circle at 15% 100%, rgb(255 61 172 / 0.28), transparent 55%), radial-gradient(circle at 100% 0%, rgb(139 92 255 / 0.35), transparent 50%), linear-gradient(160deg, #23104f, #0d0a24 60%, #07070b); color: #f4f4f7; font: 14px/1.4 system-ui, sans-serif; -webkit-app-region: drag; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 26px; letter-spacing: -0.02em; }
      .mark { width: 64px; height: 64px; }
      .logo { flex-direction: column; gap: 6px; }
      .bar { width: 160px; height: 3px; border-radius: 3px; background: #20202b; overflow: hidden; }
      .bar::after { content: ""; display: block; width: 40%; height: 100%; background: linear-gradient(90deg, #8b5cff, #ff3dac, #d7ff3a); animation: s 1.1s ease-in-out infinite; }
      @keyframes s { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
      p { color: #a1a1b3; margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo"><svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="moon" x1="18" y1="18" x2="70" y2="86" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4ff9e"/><stop offset="0.45" stop-color="#d7ff3a"/><stop offset="1" stop-color="#7dff8a"/></linearGradient><linearGradient id="bars" x1="0" y1="86" x2="0" y2="30" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b5cff"/><stop offset="0.55" stop-color="#ff3dac"/><stop offset="1" stop-color="#ff9ad5"/></linearGradient><mask id="crescent"><rect width="100" height="100" fill="#fff"/><circle cx="58" cy="40" r="25" fill="#000"/></mask><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#glow)"><circle cx="44" cy="54" r="32" fill="url(#moon)" mask="url(#crescent)"/><g stroke="#120b2c" stroke-width="3" paint-order="stroke" fill="url(#bars)"><rect x="52" y="58" width="7" height="22" rx="3.5"/><rect x="62.5" y="44" width="7" height="36" rx="3.5"/><rect x="73" y="52" width="7" height="28" rx="3.5"/><rect x="83.5" y="36" width="7" height="44" rx="3.5"/></g></g><path d="M80 14 l1.6 4.4 4.4 1.6 -4.4 1.6 -1.6 4.4 -1.6 -4.4 -4.4 -1.6 4.4 -1.6z" fill="#fff" opacity="0.95"/></svg><span>ORIVEXY <span style="color:#d7ff3a">NIGHTS</span></span></div>
      <div class="bar"></div>
      <p>Arrancando… (la primera vez tarda un poco)</p>
    </div>
  </body>
</html>
