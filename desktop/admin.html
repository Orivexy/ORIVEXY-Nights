<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Contraseña de administrador · ORIVEXY NIGHTS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #07070b; color: #f4f4f6; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { padding: 24px; }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p { margin: 0 0 14px; color: #a1a1b0; }
      .email { color: #fff; font-weight: 600; }
      label { display: block; font-size: 12px; color: #a1a1b0; margin: 12px 0 4px; }
      input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid #2d2d3a; background: #181822; color: #fff; padding: 0 12px; font: inherit; }
      input:focus { outline: none; border-color: #d7ff3a; }
      .warn { margin-top: 14px; padding: 10px 12px; border-radius: 12px; background: #2a2310; color: #ffd98a; font-size: 12.5px; }
      .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; align-items: center; }
      .row span { margin-right: auto; font-size: 12.5px; }
      button { height: 40px; border-radius: 999px; border: 0; padding: 0 20px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
      .primary { background: #d7ff3a; color: #0b0b10; }
      .ghost { background: #1c1c26; color: #fff; }
      #msg.err { color: #ff6b8b; }
      #msg.ok { color: #7dff8a; }
    </style>
  </head>
  <body>
    <main>
      <h1>Contraseña de administrador</h1>
      <p>Cuenta: <span class="email" id="email">…</span></p>
      <label for="p1">Nueva contraseña</label>
      <input id="p1" type="password" autocomplete="new-password" autofocus />
      <label for="p2">Repítela</label>
      <input id="p2" type="password" autocomplete="new-password" />
      <div class="warn">Se guarda solo en este ordenador. Si abres la app en el móvil por Wi-Fi, otros en la misma red también pueden intentar entrar: una contraseña corta es fácil de adivinar.</div>
      <div class="row">
        <span id="msg"></span>
        <button class="ghost" onclick="window.close()">Cerrar</button>
        <button class="primary" id="save">Guardar</button>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      window.adminAccount.load().then((a) => ($("email").textContent = a.email));
      $("save").onclick = async () => {
        const msg = $("msg");
        const p1 = $("p1").value, p2 = $("p2").value;
        if (p1.length < 4) return ((msg.className = "err"), (msg.textContent = "Mínimo 4 caracteres"));
        if (p1 !== p2) return ((msg.className = "err"), (msg.textContent = "No coinciden"));
        $("save").disabled = true;
        const r = await window.adminAccount.save(p1);
        $("save").disabled = false;
        msg.className = r.ok ? "ok" : "err";
        msg.textContent = r.ok ? "Guardada. Ya puedes entrar con ella." : r.error || "No se pudo guardar";
      };
    </script>
  </body>
</html>
